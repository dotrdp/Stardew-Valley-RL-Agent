[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dotrdp/Stardew-Valley-RL-Agent"
rust-version = "1.85"

[workspace.dependencies]
furrow = { path = "crates/furrow" }
furrow-expert = { path = "crates/furrow-expert" }
furrow-traj = { path = "crates/furrow-traj" }
sdv-bridge = { path = "crates/sdv-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rayon = "1.12"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
criterion = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.bench]
inherits = "release"

# Tests exercise long simulated episodes; keep them fast.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
