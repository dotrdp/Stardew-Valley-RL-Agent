# Machines: input selector is a category or an item; duration in minutes (crosses nights: time keeps running).
[[machine]]
id = 0
key = "furnace"
item = "furnace"
rules = [
  { input = "copper_ore", input_count = 3, fuel = "coal", fuel_count = 1, output = "copper_bar", output_count = 1, minutes = 180 },
