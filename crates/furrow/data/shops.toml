# Wandering merchant: present on these weekdays at the village stall; each visit rolls `slots` distinct items
# from the pool (exogenous stream keyed by seed, day). price_mult_ppm applied to the item's sell price (min floor_price).
[merchant]
poi = "merchant_stall"
location = "village"
weekdays = [2, 5]
open = 540
close = 1200
slots = 4
price_mult_ppm = 3000000
floor_price = 100
pool = [
  "radish_seed", "pea_seed", "tomato_seed", "melon_seed", "pumpkin_seed", "grape_cutting", "corn_seed",
  "morel", "honeycomb", "sea_glass", "chanterelle", "wild_plum", "snowdrop", "pinecone",
  "brown_trout", "pike", "flounder", "sea_bass", "squid", "char", "sturgeon",
  "coal", "iron_ore", "gold_ore", "amethyst", "topaz", "hardwood", "resin", "pickles", "juice", "dried_fish",
]

# Tool upgrades at the smithy: level 1,2,3 — cost in coins + bars; takes `days` in-game days (tool unusable meanwhile).
[upgrades]
days = 2
levels = [
  { level = 1, coins = 1500, bar = "copper_bar", bars = 3 },
  { level = 2, coins = 4000, bar = "iron_bar", bars = 3 },
  { level = 3, coins = 9000, bar = "gold_bar", bars = 5 },
]
