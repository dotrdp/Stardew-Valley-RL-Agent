# Daily forage spawns per location. Each day at 06:00 the location's forage count is topped up to `daily_cap`
# with items drawn by weight from the season's table (exogenous stream: seed, day, location).
[[forage_location]]
id = 0
location = "woods"
daily_cap = 8
[[forage_location.season]]
season = "spring"
items = [ { item = "morel", weight = 20 }, { item = "wild_leek", weight = 45 }, { item = "violet", weight = 35 } ]
[[forage_location.season]]
season = "summer"
items = [ { item = "blackberry", weight = 60 }, { item = "honeycomb", weight = 15 }, { item = "wild_leek", weight = 25 } ]
[[forage_location.season]]
season = "autumn"
items = [ { item = "chanterelle", weight = 20 }, { item = "hazelnut", weight = 45 }, { item = "wild_plum", weight = 25 }, { item = "pinecone", weight = 10 } ]
[[forage_location.season]]
season = "winter"
items = [ { item = "snowdrop", weight = 35 }, { item = "pinecone", weight = 65 } ]

