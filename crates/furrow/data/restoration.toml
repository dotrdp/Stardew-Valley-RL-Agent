# The Old Mill of Hollow Fork — original restoration objective.
# A request is complete when `need` of its slots are filled (or `coins` paid). A wing is complete when all its
# requests are. Episode success = all wings complete. `pool` lists candidate items for Remixed mode: each slot's
# item is resampled from the request's pool (partition "train"/"test"); counts/need never change.
[restoration]
name = "The Old Mill"

[[wing]]
id = 0
key = "threshing_floor"
name = "Threshing Floor"
reward = { kind = "unlock", feature = "greenhouse" }
[[wing]]
id = 1
key = "waterwheel"
name = "Waterwheel"
reward = { kind = "unlock", feature = "minecart" }
[[wing]]
id = 2
key = "woodland_gallery"
name = "Woodland Gallery"
reward = { kind = "energy", amount = 40 }
[[wing]]
id = 3
key = "forge_annex"
name = "Forge Annex"
reward = { kind = "tool_level", tools = ["pickaxe", "axe"] }
[[wing]]
id = 4
key = "drying_loft"
name = "Drying Loft"
reward = { kind = "unlock", feature = "merchant_daily" }
[[wing]]
id = 5
key = "keepers_office"
name = "Keeper's Office"
reward = { kind = "money", amount = 5000 }

