# Fishing without a reflex minigame. A cast takes cast_min..cast_max minutes (reduced by skill/rod).
# Catch roll: p_catch = base_ppm + skill_ppm*fishing_level + rod_ppm*rod_level - difficulty*diff_ppm, clamped.
# On a catch, an eligible fish (spot, season, weather, time window, min_rod) is drawn by weight; else junk/nothing.
[fishing]
cast_min = 12
cast_max = 20
cast_minus_per_level = 1
base_ppm = 300000
skill_ppm = 45000
rod_ppm = 80000
diff_ppm = 4000
min_ppm = 60000
max_ppm = 900000
junk_ppm_on_miss = 300000
energy_per_cast = 4
xp_per_catch = 12

# spots: farm_pond (0), woods_river (1), coast_sea (2), quarry_lake (3) — defined in world.toml as POIs of kind fishing_spot
