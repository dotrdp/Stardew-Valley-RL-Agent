# World topology and anchors. Positions are tile coordinates (x right, y down). Layout details (debris, trees, rocks,
# forage spots) are procedural per seed; everything here is fixed so POIs are always reachable.
[world]
start_location = "homestead"
start_tile = [8, 8]
day_start = 360
day_end = 1560
season_days = 24
energy_max = 200
backpack_slots = 24
stack_max = 999
start_money = 500
passout_energy_ppm = 500000
passout_money_ppm = 100000
passout_money_cap = 1000
weather_ppm = { spring = [600000, 300000, 100000, 0], summer = [700000, 200000, 100000, 0], autumn = [600000, 300000, 100000, 0], winter = [400000, 100000, 0, 500000] }  # sunny, rainy, stormy, snowy
minecart_minutes = 10       # GoTo travel time when the minecart network is unlocked (any pair of outdoor locations)

[[location]]
id = 0
key = "homestead"
name = "Homestead"
width = 48
height = 36
kind = "farm"
