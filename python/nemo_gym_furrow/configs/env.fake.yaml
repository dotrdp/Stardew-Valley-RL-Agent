# Copy to `env.yaml` in the directory you run `gym` from (Gym reads ./env.yaml) to target the fake
# model started with `python -m nemo_gym_furrow.fake_openai --port 8765`. For a real endpoint, replace
# the three policy_* values (e.g. https://api.openai.com/v1, your key, a model name).
policy_base_url: http://127.0.0.1:8765/v1
policy_api_key: dummy
